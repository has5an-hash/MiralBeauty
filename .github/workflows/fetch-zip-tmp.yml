name: fetch-zip-tmp

on:
  push:
    branches: [ "arena/01a0db61-miralbeauty" ]
    paths:
      - ".github/workflows/fetch-zip-tmp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZURL: "https://developersia.ir/MirallBeauty/miralbeauty_root.zip"
      RELAY: "https://8765-i8h89m3tr9stosjjgi6ol.e2b.app"
      RSECRET: "b6aee06f87b64aee92ccd8dd01eb250a"
    steps:
      - name: fetch-and-relay
        shell: bash
        run: |
          set +e
          N=0
          note() {
            N=$((N+1))
            [ "$N" -gt 48 ] && return 0
            MSG=$(printf '%s' "$1" | tr '\n' ' ' | cut -c1-1800)
            echo "::error file=.github/workflows/fetch-zip-tmp.yml::[dtl$N] $MSG"
          }
          note "start $(date -u +%FT%TZ) relay=$RELAY"
          # health check
          HC=$(curl -sS --max-time 30 -w '|HTTP:%{http_code}' "$RELAY/health" 2>&1)
          note "health: $HC"
          case "$HC" in *HTTP:200*) ;; *) note "RELAY-UNREACHABLE aborting"; exit 0;; esac
          # --- download ---
          note "downloading zip (up to 30 min)..."
          curl -fSL --max-time 1800 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            -o miralbeauty_root.zip "$ZURL" > curl-out.txt 2>&1
          DRC=$?
          SZ=$(stat -c%s miralbeauty_root.zip 2>/dev/null || echo 0)
          note "download rc=$DRC size=$SZ tail: $(tail -c 500 curl-out.txt | tr '\n' ' ')"
          if [ $DRC -ne 0 ] || [ "$SZ" = "0" ]; then note "DOWNLOAD-FAILED aborting"; exit 0; fi
          if ! head -c 2 miralbeauty_root.zip | grep -q "PK"; then note "NOT-A-ZIP aborting"; exit 0; fi
          FULLSHA=$(sha256sum miralbeauty_root.zip | cut -d' ' -f1)
          note "zip ok size=$SZ full_sha256=$FULLSHA"
          # --- split ---
          split -b 80m -d -a 3 miralbeauty_root.zip miralbeauty_root.zip.part_
          note "parts: $(ls miralbeauty_root.zip.part_* | tr '\n' ' ')"
          # --- upload each part to relay ---
          FAIL=0
          for p in $(ls miralbeauty_root.zip.part_* | sort); do
            PNAME=$(basename "$p")
            PSZ=$(stat -c%s "$p")
            PSHA=$(sha256sum "$p" | cut -d' ' -f1)
            OK=0
            for try in 1 2 3; do
              UP=$(curl -sS --max-time 900 -X PUT --data-binary @"$p" -w '|HTTP:%{http_code}' "$RELAY/up/$RSECRET/part=$PNAME" 2>&1 | tail -c 300)
              case "$UP" in *HTTP:200*) OK=1; break;; *) sleep 5;; esac
            done
            if [ $OK = 1 ]; then
              note "part $PNAME size=$PSZ sha=$PSHA up=OK"
            else
              note "part $PNAME size=$PSZ sha=$PSHA up=FAILED resp=$UP"
              FAIL=1
            fi
          done
          if [ $FAIL = 0 ]; then note "ALL-PARTS-UPLOADED sha=$FULLSHA"; else note "SOME-PARTS-FAILED"; fi
          note "end $(date -u +%FT%TZ)"
          exit 0
