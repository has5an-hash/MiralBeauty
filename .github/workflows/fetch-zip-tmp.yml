name: fetch-zip-tmp

on:
  push:
    branches: [ "arena/01a0db61-miralbeauty" ]
    paths:
      - ".github/workflows/fetch-zip-tmp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZURL: "https://developersia.ir/MirallBeauty/miralbeauty_root.zip"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download and commit
        run: |
          LOG=fetch-tmp.log
          : > "$LOG"
          say() { echo "$1" | tee -a "$LOG" "$GITHUB_STEP_SUMMARY"; }
          say "## fetch-zip-tmp diagnostics"
          say "curl: $(curl --version | head -1)"
          say "ip: $(ip -4 addr show 2>/dev/null | grep -m1 inet || hostname -I)"
          rm -f miralbeauty_root.zip "$LOG.bak"
          rc=99
          for i in 1 2 3; do
            say "=== attempt $i (curl) ==="
            curl -fSL --max-time 600 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
              -H "Accept: */*" -H "Accept-Language: fa-IR,fa;q=0.9,en;q=0.8" \
              -o miralbeauty_root.zip "$ZURL" 2>&1 | tee -a "$LOG" "$GITHUB_STEP_SUMMARY"
            rc=$?
            say "curl exit: $rc"
            if [ "$rc" = "0" ] && [ -s miralbeauty_root.zip ]; then break; fi
            sleep 10
          done
          say "=== file check ==="
          ls -la miralbeauty_root.zip 2>&1 | tee -a "$LOG" "$GITHUB_STEP_SUMMARY" || say "no file"
          if [ -s miralbeauty_root.zip ]; then
            say "magic: $(head -c 4 miralbeauty_root.zip | od -An -c | tr -d '\n')"
            if head -c 2 miralbeauty_root.zip | grep -q "PK"; then
              say "STATUS: ZIP-OK"
            else
              say "STATUS: NOT-ZIP first-300-chars:"
              head -c 300 miralbeauty_root.zip | tee -a "$LOG" "$GITHUB_STEP_SUMMARY"
            fi
          else
            say "STATUS: NO-FILE (curl rc=$rc)"
          fi
          git config user.name "arena-dl-bot"
          git config user.email "arena-dl-bot[bot]@users.noreply.github.com"
          git add -f miralbeauty_root.zip "$LOG" 2>/dev/null || true
          if git diff --cached --quiet; then
            say "nothing to commit"
          else
            git commit -m "temp(dlpipeline): fetch result" > /dev/null 2>&1
            say "committed: $(git rev-parse --short HEAD)"
            set +e
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME" > push_out.txt 2>&1
            prc=$?
            set -e
            say "push exit: $prc"
            cat push_out.txt | tee -a "$LOG" "$GITHUB_STEP_SUMMARY"
          fi
          say "=== end ==="
