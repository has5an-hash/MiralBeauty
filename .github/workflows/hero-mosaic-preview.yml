name: Render Desktop Mosaic Preview
on:
  push:
    branches: [hero-remix-build-20261002]
    paths: [".github/workflows/hero-mosaic-preview.yml"]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip
      - name: Render desktop mosaic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out tmp
          cat > /tmp/mosaic.py <<'PY'
          import subprocess, shlex
          PANEL_SHOT=2.40
          X=0.16
          def run(cmd):
              print("+"," ".join(shlex.quote(x) for x in cmd),flush=True)
              subprocess.run(cmd,check=True)
          left=[
            ("document_5884360535620722530.mp4",4.0),("document_5884360535620722525.mp4",7.8),
            ("document_5884360535620722518.mp4",18.0),("document_5884360535620722527.mp4",3.6),
            ("document_5884360535620722522.mp4",3.0),("document_5884360535620722529.mp4",16.5),
            ("document_5884360535620722524.mp4",15.5),("document_5884360535620722531.mp4",5.5),
            ("document_5884360535620722533.mp4",5.5),("document_5884360535620722530.mp4",2.0)]
          center=[
            ("document_5884360535620722528.mp4",5.5),("document_5884360535620722520.mp4",11.0),
            ("document_5884360535620722532.mp4",13.5),("document_5884360535620722519.mp4",20.5),
            ("document_5884360535620722526.mp4",9.5),("document_5884360535620722530.mp4",4.5),
            ("document_5884360535620722525.mp4",8.5),("document_5884360535620722524.mp4",16.5),
            ("document_5884360535620722528.mp4",6.5),("document_5884360535620722520.mp4",9.0)]
          right=[
            ("document_5884360535620722522.mp4",4.0),("document_5884360535620722531.mp4",6.0),
            ("document_5884360535620722529.mp4",17.5),("document_5884360535620722533.mp4",6.0),
            ("document_5884360535620722518.mp4",19.0),("document_5884360535620722527.mp4",4.0),
            ("document_5884360535620722532.mp4",14.0),("document_5884360535620722519.mp4",21.0),
            ("document_5884360535620722526.mp4",10.0),("document_5884360535620722522.mp4",2.0)]
          def panel(name, seq):
              clips=[]
              for i,(src,start) in enumerate(seq):
                  out=f"tmp/{name}_{i}.mp4"
                  vf="fps=30,scale=608:1080:flags=lanczos,eq=contrast=1.025:saturation=1.035:brightness=0.004,unsharp=5:5:0.18:5:5:0,format=yuv420p"
                  run(["ffmpeg","-y","-hide_banner","-loglevel","error","-ss",str(start),"-t",str(PANEL_SHOT),"-i",src,"-an","-vf",vf,"-c:v","libx264","-preset","ultrafast","-crf","14","-pix_fmt","yuv420p",out])
                  clips.append(out)
              cmd=["ffmpeg","-y","-hide_banner","-loglevel","error"]
              for x in clips: cmd+=["-i",x]
              parts=[]; last="[0:v]"
              for i in range(1,len(clips)):
                  label=f"[x{i}]"; trans="fade" if i%2 else "smoothleft"; off=i*(PANEL_SHOT-X)
                  parts.append(f"{last}[{i}:v]xfade=transition={trans}:duration={X}:offset={off:.3f}{label}")
                  last=label
              out=f"tmp/{name}.mp4"
              cmd+=["-filter_complex",";".join(parts),"-map",last,"-an","-c:v","libx264","-preset","ultrafast","-crf","14","-pix_fmt","yuv420p",out]
              run(cmd); return out
          l=panel("left",left); c=panel("center",center); r=panel("right",right)
          fc=("[0:v]setpts=PTS-STARTPTS[l];[1:v]trim=start=0.31,setpts=PTS-STARTPTS[c];"
              "[2:v]trim=start=0.63,setpts=PTS-STARTPTS[r];"
              "color=c=#130f12:s=1920x1080:r=30:d=21.9[base];"
              "[base][l]overlay=x=32:y=0[b1];[b1][c]overlay=x=656:y=0[b2];"
              "[b2][r]overlay=x=1280:y=0,format=yuv420p[outv]")
          run(["ffmpeg","-y","-hide_banner","-loglevel","error","-i",l,"-i",c,"-i",r,
               "-filter_complex",fc,"-map","[outv]","-an","-t","21.9","-r","30",
               "-c:v","libx264","-preset","medium","-profile:v","high","-level:v","4.1",
               "-b:v","3600k","-maxrate","4500k","-bufsize","9000k","-pix_fmt","yuv420p",
               "-movflags","+faststart","out/miral-hero-desktop-mosaic.mp4"])
          run(["ffmpeg","-y","-hide_banner","-loglevel","error","-ss","0.6","-i","out/miral-hero-desktop-mosaic.mp4","-frames:v","1","-c:v","libwebp","-quality","82","out/miral-hero-desktop-mosaic-poster.webp"])
          run(["ffmpeg","-y","-hide_banner","-loglevel","error","-i","out/miral-hero-desktop-mosaic.mp4","-vf","fps=1/2,scale=480:-2:flags=lanczos,tile=4x3:nb_frames=12:padding=6:margin=6","-frames:v","1","out/review-desktop-mosaic.jpg"])
          PY
          python3 /tmp/mosaic.py
          ffprobe -v error -show_entries format=duration,size,bit_rate:stream=codec_name,width,height,r_frame_rate,pix_fmt -of json out/miral-hero-desktop-mosaic.mp4 > out/ffprobe.json
          zip -9 -r MiralBeauty-Desktop-Mosaic.zip out
      - uses: actions/upload-artifact@v4
        with:
          name: MiralBeauty-Desktop-Mosaic
          path: |
            MiralBeauty-Desktop-Mosaic.zip
            out/
          retention-days: 14
