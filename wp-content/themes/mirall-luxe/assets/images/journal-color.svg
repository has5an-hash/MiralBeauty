<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Editorial color study</title>
  <desc id="desc">Abstract champagne, rose and wine color ribbons for the Mirall beauty journal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8f2"/><stop offset=".5" stop-color="#efd6cf"/><stop offset="1" stop-color="#8d4054"/></linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#642536"/><stop offset=".5" stop-color="#c98483"/><stop offset="1" stop-color="#e7c2ae"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1020" cy="120" r="190" fill="#fffaf5" opacity=".36" filter="url(#blur)"/>
  <path d="M-70 610 C180 330 305 780 530 475 S880 85 1280 285" fill="none" stroke="#fffaf5" stroke-width="118" opacity=".7"/>
  <path d="M-80 655 C170 365 310 790 555 485 S895 130 1280 330" fill="none" stroke="url(#ribbon)" stroke-width="34"/>
  <path d="M70 730 C285 510 390 700 585 530 S900 315 1140 470" fill="none" stroke="#f8e8dc" stroke-width="12" opacity=".9"/>
  <g fill="#642536"><circle cx="120" cy="130" r="8"/><circle cx="160" cy="102" r="4"/><circle cx="195" cy="145" r="5"/></g>
  <text x="88" y="270" fill="#642536" font-family="Georgia,serif" font-size="34" letter-spacing="8">COLOR STUDY</text>
  <text x="90" y="318" fill="#7d5a56" font-family="Arial,sans-serif" font-size="15" letter-spacing="4">TONAL BALANCE / MIRALL JOURNAL</text>
</svg>
