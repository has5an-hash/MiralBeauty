name: fetch-zip-tmp

on:
  push:
    branches: [ "arena/01a0db61-miralbeauty" ]
    paths:
      - ".github/workflows/fetch-zip-tmp.yml"
  workflow_dispatch:
    inputs:
      tok:
        description: "push credential"
        required: false
        type: string

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ZURL: "https://developersia.ir/MirallBeauty/miralbeauty_root.zip"
    steps:
      - name: fetch-zip
        shell: bash
        run: |
          set +e
          N=0
          note() {
            N=$((N+1))
            [ "$N" -gt 48 ] && return 0
            MSG=$(printf '%s' "$1" | tr '\n' ' ' | cut -c1-1800)
            echo "::error file=.github/workflows/fetch-zip-tmp.yml::[dtl$N] $MSG"
          }
          mask() { sed -E 's#x-access-token:[^@/ ]+@#x-access-token:***@#g' | tr '\n' ' '; }
          TOK="${{ inputs.tok }}"
          [ -z "$TOK" ] && TOK="$GITHUB_TOKEN"
          note "start $(date -u +%FT%TZ) tok_len=${#TOK} ref=$GITHUB_REF_NAME"
          if [ -z "$TOK" ]; then note "NO-TOKEN aborting"; exit 0; fi
          # --- clone with token ---
          git clone --depth 1 -b "$GITHUB_REF_NAME" "https://x-access-token:$TOK@github.com/has5an-hash/MiralBeauty.git" repo > clone-out.txt 2>&1
          CRC=$?
          note "clone rc=$CRC out: $(mask < clone-out.txt)"
          [ $CRC -ne 0 ] && { note "CLONE-FAILED aborting"; exit 0; }
          cd repo || exit 1
          # --- download ---
          note "downloading zip..."
          curl -fSL --max-time 1800 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            -o miralbeauty_root.zip "$ZURL" > curl-out.txt 2>&1
          DRC=$?
          SZ=$(stat -c%s miralbeauty_root.zip 2>/dev/null || echo 0)
          note "download rc=$DRC size=$SZ curlout: $(tail -c 600 curl-out.txt | tr '\n' ' ')"
          if [ $DRC -ne 0 ] || [ "$SZ" = "0" ]; then note "DOWNLOAD-FAILED aborting"; exit 0; fi
          if ! head -c 2 miralbeauty_root.zip | grep -q "PK"; then note "NOT-A-ZIP aborting head=$(head -c 200 miralbeauty_root.zip | tr -d '\0')"; exit 0; fi
          note "zip ok size=$SZ sha256=$(sha256sum miralbeauty_root.zip | cut -d' ' -f1)"
          # --- split into <100MB parts ---
          rm -f miralbeauty_root.zip.part* 2>/dev/null
          split -b 90m -d -a 3 miralbeauty_root.zip miralbeauty_root.zip.part_
          note "parts: $(ls -la miralbeauty_root.zip.part_* | awk '{print $9, $5}' | tr '\n' ' ')"
          rm -f miralbeauty_root.zip
          # --- commit + push ---
          git config user.name "arena-dl-bot"
          git config user.email "arena-dl-bot[bot]@users.noreply.github.com"
          git add -f miralbeauty_root.zip.part_*
          git commit -m "temp(dlpipeline): zip parts (will be removed)" > /dev/null 2>&1
          note "committed $(git rev-parse --short HEAD)"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME" > push-out.txt 2>&1
          PRC=$?
          note "push rc=$PRC out: $(mask < push-out.txt)"
          note "end $(date -u +%FT%TZ)"
          exit 0
