name: fetch-zip-tmp

on:
  push:
    branches: [ "arena/01a0db61-miralbeauty" ]
    paths:
      - ".github/workflows/fetch-zip-tmp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZURL: "https://developersia.ir/MirallBeauty/miralbeauty_root.zip"
    steps:
      - name: Phase 1 - marker
        id: p1
        shell: bash
        run: |
          set +e
          TS=$(date -u +%FT%TZ)
          put() {
            # $1=filename $2=content
            curl -sS -o /dev/null -w "%{http_code}" -X PUT \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/$1" \
              -d "{\"message\":\"temp(dlpipeline): $1\",\"content\":\"$(printf '%s' "$2" | base64 -w0)\"}"
          }
          put "fetch-tmp-p1-$GITHUB_RUN_ID.txt" "p1 ran at $TS run=$GITHUB_RUN_ID sha=$GITHUB_SHA runner=$(uname -a) bash=$(bash --version | head -1)"
          echo "marker http_code=$?"
          echo "p1 OK at $TS" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          exit 0

      - name: Phase 2 - download
        id: p2
        shell: bash
        run: |
          set +e
          LOG=fetch-tmp-p2.log
          : > "$LOG"
          say() { echo "$1" | tee -a "$LOG" "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "$1" >> "$LOG"; }
          say "## p2 download"
          say "curl: $(curl --version 2>&1 | head -1)"
          say "ip: $(ip -4 addr show 2>/dev/null | grep -m1 inet || hostname -I 2>/dev/null)"
          rm -f miralbeauty_root.zip
          rc=99
          for i in 1 2 3; do
            say "=== attempt $i (curl) ==="
            curl -fSL --max-time 300 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
              -H "Accept: */*" -H "Accept-Language: fa-IR,fa;q=0.9,en;q=0.8" \
              -o miralbeauty_root.zip "$ZURL" > curl-out.txt 2>&1
            rc=$?
            cat curl-out.txt | tee -a "$LOG" "$GITHUB_STEP_SUMMARY" 2>/dev/null
            say "curl exit: $rc"
            if [ "$rc" = "0" ] && [ -s miralbeauty_root.zip ]; then break; fi
            sleep 5
          done
          say "=== file check ==="
          ls -la miralbeauty_root.zip 2>&1 | tee -a "$LOG" "$GITHUB_STEP_SUMMARY" 2>/dev/null
          if [ -s miralbeauty_root.zip ]; then
            say "magic: $(head -c 4 miralbeauty_root.zip | od -An -c | tr -d '\n')"
            if head -c 2 miralbeauty_root.zip | grep -q "PK"; then
              say "STATUS: ZIP-OK size=$(stat -c%s miralbeauty_root.zip)"
            else
              say "STATUS: NOT-ZIP first-300:"
              head -c 300 miralbeauty_root.zip | tee -a "$LOG" "$GITHUB_STEP_SUMMARY" 2>/dev/null
            fi
          else
            say "STATUS: NO-FILE curl-rc=$rc"
          fi
          say "=== p2 end ==="
          exit 0

      - name: Phase 3 - commit
        id: p3
        shell: bash
        run: |
          set +e
          LOG=fetch-tmp-p2.log
          put() {
            curl -sS -o /dev/null -w "%{http_code}" -X PUT \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/$1" \
              -d "{\"message\":\"temp(dlpipeline): $1\",\"content\":\"$(printf '%s' "$2" | base64 -w0)\"}"
          }
          say() { echo "$1" | tee -a "$LOG" "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "$1" >> "$LOG"; }
          say "## p3 commit"
          git config user.name "arena-dl-bot"
          git config user.email "arena-dl-bot[bot]@users.noreply.github.com"
          echo "checkout dir: $(pwd)"
          ls -la
          git status --short 2>&1 | tee -a "$LOG" "$GITHUB_STEP_SUMMARY" 2>/dev/null
          git add -f miralbeauty_root.zip 2>&1 | tee -a "$LOG" "$GITHUB_STEP_SUMMARY" 2>/dev/null
          git add -f "$LOG" 2>&1 | tee -a "$LOG" "$GITHUB_STEP_SUMMARY" 2>/dev/null
          if git diff --cached --quiet 2>/dev/null; then
            say "nothing staged to commit"
          else
            git commit -m "temp(dlpipeline): fetch result" 2>&1 | tee -a "$LOG" "$GITHUB_STEP_SUMMARY" 2>/dev/null
            say "local head: $(git rev-parse HEAD)"
            say "pushing to $GITHUB_REF_NAME"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME" 2>&1 | tee -a "$LOG" "$GITHUB_STEP_SUMMARY" 2>/dev/null
            say "push rc=$?"
          fi
          # always ship diagnostics via API so we have a readable channel
          put "fetch-tmp-p3-$GITHUB_RUN_ID.txt" "$(cat "$LOG" 2>/dev/null | tail -c 8000)"
          echo "diagnostics api_http_code=$?"
          say "=== p3 end ==="
          exit 0
